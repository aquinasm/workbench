[package]
name = "workbench-shim"
version = "0.1.0"
authors = ["Aquinas Marydasan"]
license = "MIT"
edition = "2021"
description = "Ultra-fast PATH shim resolver for Workbench managed runtimes"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
