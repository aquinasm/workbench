[workspace]
members = [".", "crates/workbench-shim"]
resolver = "2"

[package]
name = "workbench"
version = "0.1.0-beta.2"
description = "Cross-platform local development environment"
authors = ["Aquinas Marydasan"]
license = "MIT"
repository = "https://github.com/aquinasm/workbench"
edition = "2021"

[lib]
name = "workbench_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
jwalk = "0.8"
rayon = "1.10"
trash = "5"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["net", "process", "io-util", "rt-multi-thread", "sync"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
