name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-beta.1)'
        required: true
        default: 'v0.1.0-beta.1'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Create or Resolve GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure GitHub Release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE="true"
            TITLE="Workbench $TAG (Public Beta)"
          else
            PRERELEASE="false"
            TITLE="Workbench $TAG"
          fi

          # Check if release already exists for this tag
          EXISTING_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            echo "id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CREATED_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="$TITLE" \
            -f body="Cross-platform local development environment built with Tauri v2, Rust, and SvelteKit." \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            --jq '.id')
          echo "id=$CREATED_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build (${{ matrix.label }})
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS Apple Silicon (aarch64)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macOS Intel (x86_64)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            label: Windows (x86_64)
            target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build workbench-shim companion binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml -p workbench-shim --target ${{ matrix.target }}

      - name: Build & Upload Tauri Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ matrix.args }}
